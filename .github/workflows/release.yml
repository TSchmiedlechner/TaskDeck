name: Release

# Tag the repo (vX.Y.Z, matching package.json) to build the installer and
# publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($pkg -ne $tag) { throw "package.json version ($pkg) does not match tag ($tag) — bump the version before tagging" }

      - run: npm run typecheck
      - run: npm test
      - run: npm run dist -- --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
